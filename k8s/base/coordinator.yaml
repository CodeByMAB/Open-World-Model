apiVersion: v1
kind: Service
metadata:
  name: coordinator
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9000
      targetPort: grpc
    - name: http-internal
      port: 9001
      targetPort: http-internal
  selector:
    app.kubernetes.io/component: coordinator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: coordinator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: coordinator
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U owm; do sleep 2; done
      containers:
        - name: coordinator
          image: owm-coordinator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9000
            - name: http-internal
              containerPort: 9001
          env:
            - name: OWM_DATABASE_MIGRATIONS_DIR
              value: /migrations
            - name: OWM_SERVER_GRPC_ADDR
              value: :9000
            - name: OWM_SERVER_HTTP_ADDR
              value: :9001
            - name: OWM_LOG_LEVEL
              value: info
            - name: OWM_LOG_FORMAT
              value: json
          envFrom:
            - secretRef:
                name: owm-coordinator-env
                optional: false
          readinessProbe:
            httpGet:
              path: /metrics
              port: http-internal
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: http-internal
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
